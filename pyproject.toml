[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimbledesk"
version = "0.1.0"
description = "A model-agnostic, cross-platform desktop agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<51",
  "dbus-next>=0.2.3,<1; sys_platform == 'linux'",
  "mcp[cli]>=1.6,<2",
  "numpy>=2,<3",
  "pillow>=10,<12",
  "pydantic>=2.11,<3",
  "pyautogui>=0.9.54,<1",
  "starlette>=0.46,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
native = [
  "pyobjc-framework-ApplicationServices>=10,<13; sys_platform == 'darwin'",
  "pywinauto>=0.6.9,<1; sys_platform == 'win32'",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
]
bundle = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
nimbledesk = "nimbledesk.cli:main"
nimbledesk-service = "nimbledesk.service:main"
nimbledesk-mcp = "nimbledesk.gateway.server:main"
nimbledesk-daemon = "nimbledesk.daemon.server:main"
nimbledesk-smoke = "nimbledesk.testing.smoke:main"
nimbledesk-highlights = "nimbledesk.media.cli:main"
nimbledesk-photos = "nimbledesk.media.photo_cli:main"
nimbledesk-create = "nimbledesk.creative.cli:main"
nimbledesk-ui = "nimbledesk.ui.server:main"
nimbledesk-music-index = "nimbledesk.creative.music_cli:main"
nimbledesk-revise = "nimbledesk.creative.revision_cli:main"
nimbledesk-approve = "nimbledesk.daemon.approval_cli:main"
nimbledesk-diagnostics = "nimbledesk.diagnostics:main"
nimbledesk-qualify = "nimbledesk.testing.qualification:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbledesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nimbledesk"]
