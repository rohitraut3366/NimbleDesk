[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimbledesk"
version = "0.1.0"
description = "A model-agnostic, cross-platform desktop agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.6,<2",
  "pillow>=10,<12",
  "pydantic>=2.11,<3",
  "pyautogui>=0.9.54,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
nimbledesk-mcp = "nimbledesk.gateway.server:main"
nimbledesk-daemon = "nimbledesk.daemon.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbledesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nimbledesk"]
